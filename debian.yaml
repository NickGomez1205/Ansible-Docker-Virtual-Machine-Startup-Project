---
- name: Install Docker and deploy compose stack on Debian VM
  hosts: debian
  become: yes
  gather_facts: yes

  vars:
    compose_repo: "https://github.com/vanderbran/CSC2510-Ansible-Project.git"     
    compose_dir: "/opt/compose-app"        # where the repo will be cloned

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine & plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create directory for clone
      file:
        path: "{{ compose_dir }}"
        state: directory

    - name: Clone the Docker Compose repo
      git:
        repo: "{{ compose_repo }}"
        dest: /home/nickgomez1205/docker-compose-repo
        version: "main"        

    - name: Run docker compose build
      command: docker compose build
      args:
        chdir: "{{ compose_dir }}"
